name: Teste

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificare tipuri
        run: npm run typecheck
      - name: Teste unitare
        run: npm test
      - name: Build web
        run: npm run build
      - name: Instalează browserele de test
        run: npx playwright install --with-deps chromium webkit
      - name: Teste end-to-end (Chromium = Windows/Edge, WebKit = macOS/Safari)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependențe sistem (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Compilează shell-ul desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml
